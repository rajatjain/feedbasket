<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>FeedBasket</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header>
  <span class="brand-icon" aria-hidden="true"></span><strong class="wordmark">feedbasket</strong>
  <button id="reload-extension" type="button" aria-label="Update ready. Reload extension" title="Update ready. Reload extension" hidden>↑</button>
  <button type="button" id="settings-toggle" aria-expanded="false" aria-controls="settings" aria-label="Settings" title="Settings">⚙</button>
</header>
<p id="notice" role="status"></p>
<section id="settings" hidden>
  <button id="sync" type="button"><span id="connection" class="connection-dot" aria-hidden="true"></span><span id="connection-label">Check connection</span></button>
  <form id="settings-form">
    <label>Backend API URL<input id="origin" type="url" required></label>
    <div class="row">
      <label>Theme<select id="theme"><option value="system">Follow system</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label>Palette<select id="accent"></select></label>
    </div>
    <button class="primary">Save settings</button>
  </form>
  <label id="pdf-override" hidden><input id="save-as-pdf" type="checkbox"> Save as a PDF link</label>
  <footer id="account" hidden><span id="profile"></span><button id="auth" type="button">Sign out</button></footer>
</section>
<form id="save" hidden>
  <div class="page-info"><h1 id="article">Current tab</h1><p id="source"></p></div>
  <div class="tag-editor" id="tag-editor">
    <label for="tags">Tags</label>
    <div class="tag-entry">
      <div id="selected-tags" role="group" aria-label="Selected tags" hidden></div>
      <input id="tags" type="text" role="combobox" aria-autocomplete="list" aria-controls="suggested-tags"
             aria-expanded="false" placeholder="Add tags…" autocomplete="off" maxlength="2450">
    </div>
    <div id="tag-suggestions" hidden>
      <p id="tag-heading" aria-hidden="true"></p>
      <ul id="suggested-tags" class="tag-list" role="listbox" aria-label="Tag suggestions"></ul>
    </div>
    <p id="tag-feedback" role="status" hidden></p>
  </div>
  <div id="feed-row" class="feed" hidden>
    <svg class="feed-icon" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
      <circle cx="8" cy="8" r="1" fill="currentColor"/><path d="M5.6 5.6a3.4 3.4 0 0 0 0 4.8m4.8-4.8a3.4 3.4 0 0 1 0 4.8M3.6 3.6a6.2 6.2 0 0 0 0 8.8m8.8-8.8a6.2 6.2 0 0 1 0 8.8"/>
    </svg>
    <div><strong id="feed-title"></strong><span class="muted">RSS feed</span></div>
  </div>
  <label id="feed-picker-row" hidden>Feed<select id="feed-picker"></select></label>
  <label id="feed-category-row" hidden>Feed category<select id="feed-category"></select></label>
  <p id="checking-page" role="status" hidden>Checking this page…</p>
  <button id="save-button" type="submit" class="primary" disabled>Save</button>
  <div id="feed-actions" hidden>
    <button id="save-subscribe-button" type="submit" value="both" disabled>Save + subscribe</button>
    <button id="subscribe-button" type="submit" value="subscribe" disabled>Subscribe</button>
  </div>
  <p id="action-feedback" role="status"></p>
</form>
<section id="queue" hidden><h2>Waiting to sync</h2><ul id="queue-list"></ul></section>
<form id="connect">
  <label>Username<input id="username" maxlength="64" required autocomplete="username"></label>
  <div class="row"><button class="primary" value="connect">Sign in</button><button value="signup">Create account</button></div>
</form>
<script type="module" src="popup.js"></script>
</body>
</html>
