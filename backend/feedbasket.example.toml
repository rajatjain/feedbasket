[server]
host = "127.0.0.1"
port = 8787
public_url = "http://127.0.0.1:8787"
allowed_hosts = ["127.0.0.1", "localhost"]

[database]
path = "~/Library/Application Support/FeedBasket/feedbasket.sqlite"

# Logs default to a logs/ folder next to the database.
# [logging]
# directory = "~/Library/Logs/FeedBasket Backend"

[google]
client_id = ""

[defaults]
feed_interval_minutes = 30
quota_bytes = 1000000000
backup_folder = "~/Library/Application Support/FeedBasket/Backups"
backup_frequency = "daily"
